<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Hi, I'm Akhil. I build AI agents that hold up in the real world.">
  <defs>
    <radialGradient id="glow" cx="80%" cy="30%" r="60%">
      <stop offset="0" stop-color="#5dffc9" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#5dffc9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5dffc9" stop-opacity="0.0"/>
      <stop offset="0.72" stop-color="#5dffc9" stop-opacity="0.0"/>
      <stop offset="0.9" stop-color="#5dffc9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5dffc9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="r"><rect width="1200" height="380" rx="22"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .trace { fill: none; stroke: #5dffc9; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 260 2400; animation: run 6s linear infinite; }
      .base { fill: none; stroke: #5dffc9; stroke-opacity: 0.16; stroke-width: 1.5; }
      .orbit { transform-origin: 985px 150px; animation: spin 40s linear infinite; }
      .orbit2 { transform-origin: 985px 150px; animation: spin 26s linear infinite reverse; }
      .dot { animation: blink 2s ease-in-out infinite; }
      @keyframes run { from { stroke-dashoffset: 260; } to { stroke-dashoffset: -2400; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes blink { 50% { opacity: 0.25; } }
      @media (prefers-reduced-motion: reduce) { .trace, .orbit, .orbit2, .dot { animation: none; } .trace { stroke-dasharray: none; stroke-opacity: 0.7; } }
    </style>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="380" fill="#05090a"/>
    <rect width="1200" height="380" fill="url(#glow)"/>

    <!-- neural core -->
    <circle cx="985" cy="150" r="118" fill="url(#core)"/>
    <g class="orbit" fill="none" stroke="#5dffc9">
      <ellipse cx="985" cy="150" rx="118" ry="44" stroke-opacity="0.45" stroke-dasharray="2 7"/>
      <ellipse cx="985" cy="150" rx="118" ry="96" stroke-opacity="0.25" stroke-dasharray="1 9"/>
      <circle cx="1103" cy="150" r="4" fill="#5dffc9" stroke="none"/>
    </g>
    <g class="orbit2" fill="none" stroke="#5dffc9">
      <ellipse cx="985" cy="150" rx="52" ry="118" stroke-opacity="0.4" stroke-dasharray="2 6"/>
      <circle cx="985" cy="32" r="3.5" fill="#ffb454" stroke="none"/>
    </g>
    <circle cx="985" cy="150" r="46" fill="none" stroke="#5dffc9" stroke-opacity="0.5" stroke-dasharray="1 5"/>
    <circle cx="985" cy="150" r="5" fill="#5dffc9"/>

    <!-- copy -->
    <circle class="dot" cx="66" cy="62" r="4" fill="#5dffc9"/>
    <text x="82" y="67" class="mono" font-size="14" letter-spacing="3" fill="#5dffc9">AKHIL PADMANABAN · SOFTWARE ENGINEER · AI SYSTEMS</text>
    <text x="60" y="158" class="serif" font-size="68" fill="#e8f1ee">Hi, I'm <tspan fill="#5dffc9" font-style="italic">Akhil.</tspan></text>
    <text x="60" y="226" class="serif" font-size="44" fill="#e8f1ee">I build AI agents that hold up</text>
    <text x="60" y="278" class="serif" font-size="44" fill="#e8f1ee">in the real world.</text>

    <!-- ECG -->
    <path id="e" class="base" d="M0 334 H150 l10 -8 l10 8 h14 l6 10 l11 -56 l11 68 l7 -22 h20 q14 -18 28 0 H470 l10 -8 l10 8 h14 l6 10 l11 -56 l11 68 l7 -22 h20 q14 -18 28 0 H790 l10 -8 l10 8 h14 l6 10 l11 -56 l11 68 l7 -22 h20 q14 -18 28 0 H1200"/>
    <path class="trace" d="M0 334 H150 l10 -8 l10 8 h14 l6 10 l11 -56 l11 68 l7 -22 h20 q14 -18 28 0 H470 l10 -8 l10 8 h14 l6 10 l11 -56 l11 68 l7 -22 h20 q14 -18 28 0 H790 l10 -8 l10 8 h14 l6 10 l11 -56 l11 68 l7 -22 h20 q14 -18 28 0 H1200"/>
  </g>
</svg>
